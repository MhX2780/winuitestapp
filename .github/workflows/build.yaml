name: Build AdvaBrowser

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4

    - name: Pin .NET 8
      shell: pwsh
      run: |- 
        Set-Content -Path 'global.json' -Value '{"sdk":{"version":"8.0.400","rollForward":"latestFeature"}}'
        dotnet --version

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore AdvaBrowser.sln

    - name: Build with MSBuild
      id: build
      shell: pwsh
      run: |- 
        msbuild AdvaBrowser.csproj /p:Configuration=Release /p:Platform=x64 /v:detailed 2>&1 | Tee-Object -FilePath build-log.txt
        Write-Host "BUILD EXIT CODE: $LASTEXITCODE"
      continue-on-error: true

    - name: Extract errors
      if: steps.build.outcome == 'failure'
      shell: pwsh
      run: |- 
        Write-Host '=== ERRORS ==='
        Select-String -Path build-log.txt -Pattern 'error ' | Select-Object -First 50 | ForEach-Object { Write-Host $_.Line }

    - name: Publish self-contained single-file
      id: publish
      if: steps.build.outcome == 'success'
      shell: pwsh
      run: |- 
        dotnet publish AdvaBrowser.csproj -c Release -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:IncludeAllContentForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:EnableMsixTooling=true `
          -p:WindowsPackageType=None `
          -p:WindowsAppSDKSelfContained=true 2>&1 | Tee-Object -FilePath publish-log.txt
        $code = $LASTEXITCODE
        Write-Host "PUBLISH EXIT CODE: $code"
        if ($code -eq 0) {
          echo "publish_ok=true" >> $env:GITHUB_OUTPUT
        } else {
          echo "publish_ok=false" >> $env:GITHUB_OUTPUT
        }
      continue-on-error: true

    - name: Show publish errors
      if: steps.publish.outputs.publish_ok != 'true'
      shell: pwsh
      run: |- 
        Write-Host "=== PUBLISH ERRORS ==="
        if (Test-Path publish-log.txt) {
          Select-String -Path publish-log.txt -Pattern 'error ' | Select-Object -First 20 | ForEach-Object { Write-Host $_.Line }
        }

    - name: Find published EXE
      id: findexe
      if: steps.publish.outputs.publish_ok == 'true'
      shell: pwsh
      run: |- 
        $exe = Get-ChildItem -Path '.' -Recurse -Filter 'AdvaBrowser.exe' -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -like '*bin*Release*publish*' } |
          Select-Object -First 1
        if ($exe) {
          echo "exe_found=true" >> $env:GITHUB_OUTPUT
          echo "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          $size = [math]::Round(($exe.Length / 1MB), 2)
          Write-Host "PUBLISHED EXE: $($exe.FullName) ($size MB)"
        } else {
          echo "exe_found=false" >> $env:GITHUB_OUTPUT
          Write-Host "Published EXE not found"
        }

    - name: Copy icon next to EXE
      if: steps.findexe.outputs.exe_found == 'true'
      shell: pwsh
      run: |-
        Copy-Item -Path "app.ico" -Destination "${{ steps.findexe.outputs.exe_dir }}\app.ico" -Force
        Write-Host "Copied app.ico to publish dir"

    - name: Find fallback EXE (non-publish build)
      id: findexe2
      if: steps.findexe.outputs.exe_found != 'true' && steps.build.outcome == 'success'
      shell: pwsh
      run: |- 
        $exe = Get-ChildItem -Path '.' -Recurse -Filter 'AdvaBrowser.exe' -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -like '*bin*Release*' } |
          Select-Object -First 1
        if ($exe) {
          echo "exe_found=true" >> $env:GITHUB_OUTPUT
          echo "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "FALLBACK EXE: $($exe.FullName)"
        } else {
          echo "exe_found=false" >> $env:GITHUB_OUTPUT
        }

    - name: Copy icon next to fallback EXE
      if: steps.findexe2.outputs.exe_found == 'true' && steps.findexe.outputs.exe_found != 'true'
      shell: pwsh
      run: |-
        Copy-Item -Path "app.ico" -Destination "${{ steps.findexe2.outputs.exe_dir }}\app.ico" -Force
        Write-Host "Copied app.ico to fallback dir"

    - name: Create Release (single-file)
      if: steps.findexe.outputs.exe_found == 'true' && github.event_name == 'push'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |- 
        $tag = "v1.0.0-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
        $exePath = "${{ steps.findexe.outputs.exe_path }}"
        $icoPath = Join-Path "${{ steps.findexe.outputs.exe_dir }}" "app.ico"
        $zip = "AdvaBrowser-$tag.zip"
        $tempDir = Join-Path $env:TEMP "AdvaBrowserRelease"
        New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
        Copy-Item -Path $exePath -Destination $tempDir -Force
        if (Test-Path $icoPath) { Copy-Item -Path $icoPath -Destination $tempDir -Force }
        Compress-Archive -Path "$tempDir\*" -DestinationPath $zip -Force
        $size = [math]::Round(((Get-Item $zip).Length / 1MB), 2)
        Write-Host "ZIP: $zip ($size MB)"
        $body = @{ tag_name=$tag; target_commitish=$env:GITHUB_SHA; name="Release $tag"; body="AdvaBrowser $tag - Self-contained single-file release ($size MB)`n`nExtract the zip and run AdvaBrowser.exe"; draft=$false; prerelease=$false } | ConvertTo-Json -Compress
        $h = @{ "Authorization"="token $env:GITHUB_TOKEN"; "Accept"="application/vnd.github+json" }
        $r = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases" -Method Post -Headers $h -Body $body -ContentType 'application/json'
        $url = $r.upload_url -replace '\{\?name,label\}', ''
        Invoke-RestMethod -Uri "${url}?name=$zip" -Method Post -Headers $h -Body ([IO.File]::ReadAllBytes("$PWD\$zip")) -ContentType 'application/zip' | Out-Null
        Write-Host "RELEASE: $($r.html_url)"

    - name: Create Release (fallback, folder zip)
      if: steps.findexe.outputs.exe_found != 'true' && steps.findexe2.outputs.exe_found == 'true' && github.event_name == 'push'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |- 
        $tag = "v1.0.0-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
        $dir = "${{ steps.findexe2.outputs.exe_dir }}"
        $zip = "AdvaBrowser-$tag.zip"
        Compress-Archive -Path "$dir\*" -DestinationPath $zip
        $size = [math]::Round(((Get-Item $zip).Length / 1MB), 2)
        Write-Host "ZIP: $zip ($size MB)"
        $body = @{ tag_name=$tag; target_commitish=$env:GITHUB_SHA; name="Release $tag"; body="AdvaBrowser $tag - Full folder release ($size MB)`n`nExtract the zip and run AdvaBrowser.exe"; draft=$false; prerelease=$false } | ConvertTo-Json -Compress
        $h = @{ "Authorization"="token $env:GITHUB_TOKEN"; "Accept"="application/vnd.github+json" }
        $r = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases" -Method Post -Headers $h -Body $body -ContentType 'application/json'
        $url = $r.upload_url -replace '\{\?name,label\}', ''
        Invoke-RestMethod -Uri "${url}?name=$zip" -Method Post -Headers $h -Body ([IO.File]::ReadAllBytes("$PWD\$zip")) -ContentType 'application/zip' | Out-Null
        Write-Host "RELEASE: $($r.html_url)"

    - name: Upload logs on failure
      if: steps.build.outcome == 'failure' || steps.publish.outputs.publish_ok != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: |
          build-log.txt
          publish-log.txt
